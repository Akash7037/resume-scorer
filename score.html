<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Scorer — Results</title>
  <link rel="stylesheet" href="score.css">
</head>
<body>

  <div class="card">
    <h1>Resume Scorer — Results</h1>
    <p class="sub">This page shows results returned from backend.</p>

    <div id="circle">
      <div id="percent">--%</div>
    </div>

    <h2>Summary</h2>
    <p id="summary">Waiting for backend result...</p>

    <div class="metrics">
      <p>Clarity: <span id="clarity">--%</span></p>
      <p>Relevance: <span id="relevance">--%</span></p>
      <p>Format: <span id="format">--%</span></p>
    </div>

    <h3>Suggestions</h3>
    <p id="suggestions">Loading...</p>

    <button onclick="window.location.href='index.html'">Upload another resume</button>
  </div>

  <script src="score.js"></script>
</body>
</html>

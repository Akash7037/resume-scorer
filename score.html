<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Scorer — Results</title>
  <link rel="stylesheet" href="styles-score.css">
</head>
<body>

<div class="container">
  
  <!-- Left side score circle -->
  <div class="left-panel">
    <div id="circle">
      <span id="percent">--%</span>
    </div>

    <div class="mini-scores">
      <p>Clarity: <span id="clarity">--%</span></p>
      <p>Relevance: <span id="relevance">--%</span></p>
      <p>Format: <span id="format">--%</span></p>
    </div>

    <a class="btn" href="index.html">Upload another resume</a>
  </div>

  <!-- Right side content -->
  <div class="right-panel">
    <h2>Summary</h2>
    <p id="summary">Loading...</p>

    <h2>Suggestions</h2>
    <pre id="suggestions">Loading...</pre>
  </div>
</div>

<script src="score.js"></script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Scorer — Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="card">
    <h1>Resume Scorer</h1>
    <p>Upload your resume PDF</p>

    <form id="uploadForm">
      <input type="file" id="resume" accept="application/pdf" required>
      <button type="submit">Upload & Score</button>
    </form>

    <p id="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
